name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ctf-tools-linux-x86_64.tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: ctf-tools-linux-x86_64-musl.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ctf-tools-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ctf-tools dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf ${{ matrix.artifact }} -C dist .
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ctf-tools.exe dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}
          $hash = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}" | Out-File ${{ matrix.artifact }}.sha256 -Encoding ascii

      - name: Dependency inventory + lockfile (linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo generate-lockfile
          cargo tree --workspace --all-features > dist/dependency-tree.txt
          cargo install --locked cargo-cyclonedx || true
          cargo cyclonedx --format json --output-path dist/sbom.json || true
          cp Cargo.lock dist/Cargo.lock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            dist/Cargo.lock
            dist/dependency-tree.txt
            dist/sbom.json
          if-no-files-found: ignore

  release:
    name: attach release assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/Cargo.lock
            dist/dependency-tree.txt
            dist/sbom.json
            dist/dependency-inventory.sha256
          generate_release_notes: true
