[package]
name = "binarchae"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Recursive binary archaeology: analysis, extraction, recovery, and provenance over arbitrary binary data"
license = "MIT OR Apache-2.0"
repository = "https://github.com/whopxxx/binarchae"
readme = "README.md"

[lib]
name = "binarchae"
path = "src/lib.rs"

[[bin]]
name = "binarchae"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
crc32fast = "1"
crc = "3"
flate2 = "1"
lzma-rust = "0.1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
termcolor = "1"
bzip2 = "0.4"
zstd = "0.13"
lz4_flex = "0.11"
brotli = "6"
sevenz-rust2 = "0.23"
cab = "0.6"
rars = "0.9.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scan_bench"
harness = false

[profile.release]
lto = "thin"
